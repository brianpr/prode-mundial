<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode Mundial 2026</title>
<style>
:root{ color-scheme: light;
 --bg:#f4f6fb; --card:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
 --accent:#2563eb; --accentbg:#eff6ff;
 --ok:#16a34a; --okbg:#f0fdf4; --ai:#0891b2; --aibg:#ecfeff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:0 0 60px}
.wrap{max-width:960px;margin:0 auto;padding:14px}
header{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:10px;border-bottom:1px solid var(--line)}
h1{font-size:20px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);font-size:12.5px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prodebar{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 6px;-webkit-overflow-scrolling:touch}
.pchip{flex:none;border:1.5px solid var(--line);background:#fff;padding:7px 13px;border-radius:11px;font-weight:700;cursor:pointer;font-size:13.5px;color:var(--mut);display:flex;align-items:center;gap:7px;transition:.12s}
.pchip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.pchip.active{border-color:var(--c);color:var(--c);background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.pchip.active .dot{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.pnew{flex:none;border:1.5px dashed var(--line);background:transparent;padding:7px 12px;border-radius:11px;font-weight:700;cursor:pointer;font-size:13.5px;color:var(--mut)}
.pnew:hover{border-color:var(--accent);color:var(--accent)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px;transition:.12s}
.btn:hover{background:#f8fafc}
.btn:active{transform:scale(.97)}
.btn.ai{color:var(--ai);border-color:#a5f3fc;background:var(--aibg)}
.btn.ai:hover{background:#cffafe}
.btn.ghost{border-style:dashed}
.btn.sm{padding:5px 8px;font-size:11.5px}
.btn.danger:hover{background:#fef2f2;border-color:#fecaca;color:#dc2626}
.btn:disabled{opacity:.5;cursor:wait}
.navchips{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--mut)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.on.done{background:var(--ok);border-color:var(--ok);color:#fff}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));transition:.3s}
.section{margin-top:18px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.gtitle{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px}
.gletter{width:30px;height:30px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px}
.match{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.match:first-of-type{border-top:0}
.tm{display:flex;align-items:center;gap:6px;min-width:0}
.tm.home{justify-content:flex-end;text-align:right}
.tm .fl{font-size:18px;flex:none}
.tm .nm{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{display:flex;align-items:center;gap:4px}
.score input{width:34px;height:34px;text-align:center;border:1.5px solid var(--line);border-radius:8px;font-size:16px;font-weight:700;color:var(--ink);background:#fff}
.score input:focus{outline:0;border-color:var(--accent);background:var(--accentbg)}
.score .x{color:var(--mut);font-weight:700;font-size:13px}
.mxai{border:0;background:transparent;cursor:pointer;font-size:15px;opacity:.5;padding:2px}
.mxai:hover{opacity:1}
.meta{grid-column:1/-1;font-size:10.5px;color:var(--mut);padding-left:2px;margin-top:-2px}
table.stand{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
.stand th{color:var(--mut);font-weight:600;text-align:center;padding:4px 3px;font-size:10.5px;text-transform:uppercase}
.stand th:first-child,.stand td:first-child{text-align:left}
.stand td{padding:5px 3px;text-align:center;border-top:1px solid var(--line)}
.stand tr.q td{background:var(--okbg)}
.stand tr.q td:first-child{font-weight:700}
.stand .pos{display:inline-block;width:16px;color:var(--mut)}
.stand tr.q .pos{color:var(--ok);font-weight:800}
.kteam input.tn{width:100%;border:1px dashed var(--line);border-radius:7px;padding:6px 8px;font-size:13px;font-weight:600;color:var(--ink);background:#fff}
.kteam input.tn:focus{outline:0;border-color:var(--accent);border-style:solid}
.klabel{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90%}
.toast.show{opacity:1}
.foot{text-align:center;color:var(--mut);font-size:11px;margin-top:20px}
.legend{font-size:11px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:4px;background:var(--okbg);border:1px solid var(--ok)}
.aihint{font-size:11px;color:var(--ai);background:var(--aibg);border:1px solid #a5f3fc;border-radius:8px;padding:7px 10px;margin-top:8px}
.iinput{margin:4px 16px 0;border:1.5px solid var(--line);border-radius:9px;padding:10px 12px;font-size:15px;color:var(--ink);background:#fff}
.iinput:focus{outline:0;border-color:var(--accent)}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:14px;width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--line)}
.mhead b{font-size:15px}
.mhead button{border:0;background:transparent;font-size:18px;cursor:pointer;color:var(--mut)}
.mdesc{margin:12px 16px 8px;font-size:12.5px;color:var(--mut)}
.mta{margin:0 16px;flex:1;min-height:200px;border:1px solid var(--line);border-radius:9px;padding:10px;font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;color:var(--ink);background:#fafbfc}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:13px 16px}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05);background:var(--accent)}
@media(max-width:560px){.tm .nm{font-size:12px}.match{gap:4px}.score input{width:30px;height:30px}}
</style>
</head>

<div class="wrap">
<header>

 <div class="sub">Marcador exacto · prodes ilimitados · asistencia de IA por copiar/pegar</div>
 <div class="prodebar" id="prodebar"></div>
 <div class="row" style="justify-content:space-between;margin-top:4px">
  <div class="row">
   <button class="btn ghost" onclick="cloneProde()" title="Crear un clon del prode activo">⧉ Duplicar</button>
   <button class="btn" onclick="renameProde()" title="Renombrar el prode activo">✎ Renombrar</button>
   <button class="btn danger" onclick="deleteProde()" title="Borrar el prode activo">🗑</button>
  </div>
 </div>

   <button class="btn ai sm" onclick="openPrompt('all')" title="Generar prompt para que una IA complete todo">🤖 Prompt IA (torneo)</button>

   <button class="btn sm" onclick="document.getElementById('importFile').click()" title="Cargar prodes desde un archivo JSON">⬆ Importar</button>
   <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importJSON(this)">
 </div>
 <div class="bar"><i id="prog" style="width:0%"></i></div>

 </div>
 <div class="navchips" id="nav"></div>
</header>

<div id="groups" class="section"></div>
<div id="knock" class="section knock"></div>

<div class="foot">Datos: fixture oficial Mundial FIFA 2026 (104 partidos). Las sugerencias de IA son estimaciones. Se guarda solo en este dispositivo (localStorage); usá Exportar para respaldar.</div>
</div>

<div class="modal" id="modal">
 <div class="sheet">
   <div class="mhead"><b id="mtitle"></b><button onclick="closeModal()">✕</button></div>
   <p class="mdesc" id="mdesc"></p>
   <textarea class="mta" id="mta" spellcheck="false"></textarea>
   <div class="mfoot" id="mfoot"></div>
 </div>
</div>
<div class="modal" id="imodal">
 <div class="sheet" style="max-width:430px">

   <p class="mdesc" id="idesc" style="display:none"></p>
   <input class="iinput" id="iinput" spellcheck="false">
   <div class="mfoot" id="ifoot"></div>
 </div>
</div>

  try{ const old=JSON.parse(localStorage.getItem("prodeMundial2026_v1")||"null"); if(Array.isArray(old)) return { prodes: old.map((p,i)=>({name:"Prode "+(i+1), preds:p||{}})), active:0 }; }catch(e){}
  return null;
}
function load(){ return restore() || { prodes:[{name:"Prode 1",preds:{}},{name:"Prode 2",preds:{}}], active:0 }; }
function save(){ store.active=prode; const s=JSON.stringify(store); let ok=false;
  try{ localStorage.setItem(LS_KEY, s); if(localStorage.getItem(LS_KEY)===s) ok=true; }catch(e){}
  try{ window.name = MARK + s; }catch(e){}
  storageOK=ok; updateSaveBadge(); refreshProgress(); }

function P(){ return store.prodes[prode].preds; }
function rec(id){ if(!P()[id]) P()[id]={}; return P()[id]; }
function colorOf(i){ return PALETTE[i % PALETTE.length]; }
function applyAccent(){ const c=colorOf(prode); document.documentElement.style.setProperty('--accent',c); document.documentElement.style.setProperty('--c',c); }

function exportJSON(){
  store.active=prode;
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='prode-mundial-2026_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); toast('Exportado ('+store.prodes.length+' prode/s)');
}
function importJSON(input){
  const f=input.files&&input.files[0]; if(!f){ return; }
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result); let prodes=null;
      if(data && Array.isArray(data.prodes)) prodes=data.prodes;
      else if(Array.isArray(data)) prodes=data.map((p,i)=>({name:(p&&p.name)||('Prode '+(i+1)), preds:(p&&p.preds)||p||{}}));
      if(!prodes||!prodes.length) throw new Error('formato no reconocido');
      prodes=prodes.map((p,i)=>({name:String((p&&p.name)||('Prode '+(i+1))), preds:(p&&p.preds&&typeof p.preds==='object')?p.preds:{}}));
      uiConfirm('Importás '+prodes.length+' prode/s. ¿Reemplazar TODOS los actuales, o agregarlos a los que ya tenés?',
        function(){ store.prodes=prodes; prode=0; save(); applyAccent(); render(); toast('Reemplazado: '+prodes.length+' prode/s'); },
        function(){ const n=store.prodes.length; store.prodes=store.prodes.concat(prodes); prode=n; save(); applyAccent(); render(); toast('Agregados: '+prodes.length+' prode/s'); },
        "Reemplazar todo", "Agregar");
    }catch(e){ console.error(e); toast('Archivo inválido: '+e.message); }
    input.value='';
  };
  r.readAsText(f);
}

function matchLabel(m){
  if(m.stage==='group') return m.hen+' vs '+m.aen;
  const r=P()[m.id]||{}; return (r.ht||m.label+' local')+' vs '+(r.at||'visitante');
}
function collectForPrompt(scope){
  if(scope==='all') return MATCHES.filter(m=>m.stage==='group');
  if(scope.length===1) return MATCHES.filter(m=>m.stage==='group'&&m.group===scope);
  if(scope[0]==='m'){ const id=+scope.slice(1); return MATCHES.filter(m=>m.id===id); }
  return [];
}
function buildPrompt(scope){
  const ms=collectForPrompt(scope);
  const lines=ms.map(m=>`id ${m.id}: ${matchLabel(m)}`).join('\n');
  const titulo = scope==='all' ? 'todos los partidos de la fase de grupos del Mundial 2026'
              : scope.length===1 ? 'los partidos del Grupo '+scope+' del Mundial 2026'
              : 'este partido del Mundial 2026';
  return `Sos analista de fútbol. Predecí el MARCADOR EXACTO más probable de ${titulo}, considerando ranking FIFA, planteles y forma reciente.\n`+
         `Devolvé ÚNICAMENTE un JSON array (sin texto extra, sin markdown), un objeto por partido, respetando el "id":\n`+
         `[{"id":${ms[0]?ms[0].id:123},"hs":2,"as":1}]\n\n`+
         `Partidos:\n${lines}`;
}
let pasteMode=false;
function openPrompt(scope){

  document.getElementById('modal').classList.add('show');

}
function openPaste(){
  pasteMode=true;
  document.getElementById('mtitle').textContent='Pegar respuesta de la IA';

  const ta=document.getElementById('mta'); ta.value=''; ta.readOnly=false; ta.placeholder='[{"id":104456,"hs":2,"as":0}, ...]';
  document.getElementById('mfoot').innerHTML='<button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" onclick="applyPaste()">✓ Aplicar</button>';
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>document.getElementById('mta').focus(),50);
}
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
function copyTA(){
  const ta=document.getElementById('mta'); ta.select();
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value); } else { document.execCommand('copy'); } toast('Copiado ✓'); }
  catch(e){ document.execCommand && document.execCommand('copy'); toast('Seleccionado: copiá con Ctrl/Cmd+C'); }
}
function parseJSON(s){
  if(typeof s!=='string') s=JSON.stringify(s);
  let m=s.match(/```(?:json)?\s*([\s\S]*?)```/); if(m) s=m[1];
  const a=s.indexOf('{'), b=s.lastIndexOf('}'); const c=s.indexOf('['), d=s.lastIndexOf(']');
  let cand = (c!==-1 && (c<a || a===-1)) ? s.slice(c,d+1) : s.slice(a,b+1);
  return JSON.parse(cand);
}
function applyPaste(){
  const raw=document.getElementById('mta').value.trim();
  if(!raw){ toast('Pegá algo primero'); return; }
  let data; try{ data=parseJSON(raw); }catch(e){ toast('JSON inválido: '+e.message); return; }
  let items=[];
  if(Array.isArray(data)) items=data;
  else if(data && typeof data==='object'){ items=Object.keys(data).map(k=>Object.assign({id:k}, data[k])); }
  let n=0;
  items.forEach(o=>{
    const id=+o.id; const m=MATCHES.find(x=>x.id===id); if(!m) return;
    if(o.hs!=null) rec(id).hs=Math.max(0,parseInt(o.hs)||0);
    if(o.as!=null) rec(id).as=Math.max(0,parseInt(o.as)||0);
    if(o.ht!=null) rec(id).ht=String(o.ht);
    if(o.at!=null) rec(id).at=String(o.at);
    n++;
  });
  save(); render(); closeModal(); toast(n>0?('✓ Aplicados '+n+' partidos'):'No coincidió ningún id');
}

/* ---------- progress ---------- */
function refreshProgress(){
  let done=0;
  MATCHES.forEach(m=>{ const r=P()[m.id]; if(r && r.hs!=null && r.hs!=='' && r.as!=null && r.as!=='') done++; });
  const pct=Math.round(done/MATCHES.length*100);
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('progtxt').textContent=done+' / '+MATCHES.length+' cargados';
  document.querySelectorAll('.chip').forEach(c=>{ const v=c.dataset.v; const ms=matchesOf(v);
    const ok=ms.length>0 && ms.every(m=>{const r=P()[m.id]; return r&&r.hs!==''&&r.hs!=null&&r.as!==''&&r.as!=null;});
    c.classList.toggle('done', ok); });
}
function matchesOf(v){ if(v.length===1) return MATCHES.filter(m=>m.stage==='group'&&m.group===v);
  return MATCHES.filter(m=>m.stage==='ko'&&m.group===v); }

function scoreCell(m){ const r=P()[m.id]||{};
  return `<div class="score">
    <input type="number" min="0" max="20" inputmode="numeric" value="${r.hs??''}" onchange="setScore(${m.id},'hs',this.value)" aria-label="goles local">
    <span class="x">:</span>
    <input type="number" min="0" max="20" inputmode="numeric" value="${r.as??''}" onchange="setScore(${m.id},'as',this.value)" aria-label="goles visitante">
   </div>`; }
function renderGroup(g){
  const ms=MATCHES.filter(m=>m.stage==='group'&&m.group===g);
  const el=document.getElementById('groups');
  el.innerHTML=`<div class="gcard">
    <div class="ghead">
      <div class="gtitle"><span class="gletter">${g}</span> Grupo ${g}</div>
      <button class="btn ai sm" onclick="openPrompt('${g}')" title="Prompt para que una IA complete este grupo">🤖 Prompt grupo</button>
    </div>
    <div id="ml-${g}">${ms.map(m=>matchRow(m)).join('')}</div>
    ${standingsTable(g,ms)}
    <div class="legend"><span><i></i>Clasifican (top 2 + mejores terceros)</span></div>
  </div>`;
}
function matchRow(m){
  return `<div class="match">
    ${teamCell('h',m)} ${scoreCell(m)} ${teamCell('a',m)}
    <button class="mxai" title="Prompt IA de este partido" onclick="openPrompt('m${m.id}')">🤖</button>
    <div class="meta">J${m.md} · ${fmtDate(m.date)} ${m.time}${m.stadium?' · '+m.stadium:''}</div>
  </div>`;
}
function fmtDate(d){ const p=d.split('-'); return p[2]+'/'+p[1]; }

/* ---------- standings ---------- */
function standingsTable(g,ms){
  const teams={};
  MATCHES.filter(m=>m.stage==='group'&&m.group===g).forEach(m=>{
    teams[m.h]=teams[m.h]||{n:m.h,f:m.hf,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
    teams[m.a]=teams[m.a]||{n:m.a,f:m.af,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0};
  });
  ms.forEach(m=>{ const r=P()[m.id]; if(!r||r.hs===''||r.hs==null||r.as===''||r.as==null) return;
    const hs=+r.hs, as=+r.as, H=teams[m.h], A=teams[m.a];
    H.pj++;A.pj++;H.gf+=hs;H.gc+=as;A.gf+=as;A.gc+=hs;
    if(hs>as){H.g++;A.p++;H.pts+=3;} else if(hs<as){A.g++;H.p++;A.pts+=3;} else {H.e++;A.e++;H.pts++;A.pts++;}
  });
  const arr=Object.values(teams).sort((a,b)=>b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf || a.n.localeCompare(b.n));
  return `<table class="stand"><thead><tr>
     <th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DG</th><th>Pts</th></tr></thead><tbody>
     ${arr.map((t,i)=>`<tr class="${i<2?'q':''}">
       <td><span class="pos">${i+1}</span> ${t.f} ${t.n}</td>
       <td>${t.pj}</td><td>${t.g}</td><td>${t.e}</td><td>${t.p}</td>
       <td>${t.gf}</td><td>${t.gc}</td><td>${t.gf-t.gc>0?'+':''}${t.gf-t.gc}</td><td><b>${t.pts}</b></td></tr>`).join('')}
   </tbody></table>`;
}

/* ---------- knockout ---------- */
function renderKO(ph){
  const ms=MATCHES.filter(m=>m.stage==='ko'&&m.group===ph);
  const el=document.getElementById('knock');
  el.innerHTML=`<div class="gcard">
    <div class="ghead">
      <div class="gtitle"><span class="gletter">🏆</span> ${ph}</div>
      <span style="font-size:11.5px;color:var(--mut)">Escribí los equipos clasificados y el marcador</span>
    </div>
    ${ms.map(m=>koRow(m)).join('')}
    <div class="aihint">Tip: completá los equipos y después usá 🤖 en cada partido para pedirle el marcador a una IA.</div>
  </div>`;
}
function koRow(m){
  const r=P()[m.id]||{};
  return `<div class="match">
    <div class="kteam"><div class="klabel">${m.label} · local</div>
      <input class="tn" value="${escapeHtml(r.ht??'')}" placeholder="Equipo" onchange="setScore(${m.id},'ht',this.value)"></div>
    ${scoreCell(m)}
    <div class="kteam"><div class="klabel">visitante</div>
      <input class="tn" value="${escapeHtml(r.at??'')}" placeholder="Equipo" onchange="setScore(${m.id},'at',this.value)"></div>
    <button class="mxai" title="Prompt IA de este partido" onclick="openPrompt('m${m.id}')">🤖</button>
    <div class="meta">${fmtDate(m.date)} ${m.time}</div>
  </div>`;
}

/* ---------- edits ---------- */
function setScore(id,k,v){ rec(id)[k]=v; save();
  const m=MATCHES.find(x=>x.id===id); if(m && m.stage==='group') renderGroup(m.group); }

/* ---------- modal de entrada propio (prompt/confirm no andan en el sandbox) ---------- */
function iAbort(){ document.getElementById('imodal').classList.remove('show'); }
function uiPrompt(title, label, def, cb){
  document.getElementById('ititle').textContent=title;
  const d=document.getElementById('idesc'); d.style.display=label?'block':'none'; d.textContent=label||'';
  const inp=document.getElementById('iinput'); inp.style.display=''; inp.value=def||'';
  const foot=document.getElementById('ifoot');
  foot.innerHTML='';
  const cancel=document.createElement('button'); cancel.className='btn'; cancel.textContent='Cancelar'; cancel.onclick=iAbort;
  const ok=document.createElement('button'); ok.className='btn primary'; ok.textContent='Aceptar';
  const go=()=>{ const v=inp.value.trim(); iAbort(); cb(v); };
  ok.onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); go(); } if(e.key==='Escape') iAbort(); };
  foot.appendChild(cancel); foot.appendChild(ok);
  document.getElementById('imodal').classList.add('show');
  setTimeout(()=>{ inp.focus(); inp.select(); },50);
}
function uiConfirm(msg, onYes, onNo, yesLabel, noLabel){
  document.getElementById('ititle').textContent='Confirmar';
  const d=document.getElementById('idesc'); d.style.display='block'; d.textContent=msg;
  document.getElementById('iinput').style.display='none';
  const foot=document.getElementById('ifoot'); foot.innerHTML='';
  const no=document.createElement('button'); no.className='btn'; no.textContent=noLabel||'No'; no.onclick=()=>{ iAbort(); if(onNo) onNo(); };
  const yes=document.createElement('button'); yes.className='btn primary'; yes.textContent=yesLabel||'Sí'; yes.onclick=()=>{ iAbort(); if(onYes) onYes(); };
  foot.appendChild(no); foot.appendChild(yes);
  document.getElementById('imodal').classList.add('show');
}

/* ---------- init ---------- */
prode = Math.min(store.active||0, store.prodes.length-1);
applyAccent(); buildNav(); render(); save(); updateSaveBadge();
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
document.getElementById('imodal').addEventListener('click',e=>{ if(e.target.id==='imodal') iAbort(); });
